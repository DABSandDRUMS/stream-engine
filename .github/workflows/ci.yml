name: ci
on:
  push:
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev libasound2-dev libturbojpeg0-dev libluajit-5.1-dev \
            libhidapi-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  relay:
    runs-on: ubuntu-24.04
    if: hashFiles('relay/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: relay
      - run: npm test
        working-directory: relay
