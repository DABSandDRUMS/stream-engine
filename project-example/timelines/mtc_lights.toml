# Lighting show on MIDI Time Code: the `main` cue list and the front-wash master follow MTC
# coming in on the Studio 24c's 5-pin MIDI input (set the port in project.toml [timecode]
# mtc_in, or write `source = "mtc:<port>"` here).
#
# Chase: locks within 1 frame of jitter, freewheels 2 s through dropouts, and a locate (MTC
# full-frame message or a jump in the quarter frames) applies the tracked state at the new
# time — the latest cue of each cue list and every `set` before it — instead of replaying the
# cues in between. Times are timecode labels at `fps`.
label = "Lights on MTC"
source = "mtc"
fps = "25"
priority = 250

[chase]
jitter = "40ms"
freewheel = "2s"

# Cue list `main` (lights/cuelists/main.toml): one cue per section of the song.
[[track]]
name = "main"
cues = [
  { at = "01:00:00:00", do = ["lights.cue cuelist=main cue=1"], label = "intro" },
  { at = "01:00:16:00", do = ["lights.cue cuelist=main cue=2"], label = "verse" },
  { at = "01:00:32:00", do = ["lights.cue cuelist=main cue=3"], label = "pre-chorus" },
  { at = "01:00:40:00", do = ["lights.cue cuelist=main cue=4"], label = "chorus" },
  { at = "01:01:12:00", do = ["lights.cue cuelist=main cue=5"], label = "outro" },
]

# Momentary hits: fire only when the playhead passes them (never re-fired on a locate).
[[track]]
name = "hits"
cues = [
  { at = "01:00:40:00", do = ["preset.fire chorus_blast"], track = false },
]

# Front wash master: fades up through the intro, dips for the verse, full for the chorus.
# (`lights.group.front.master` scales the group's output, so it can also dim cue looks.)
[[track]]
name = "front master"
type = "automation"
address = "lights.group.front.master"
keys = [
  { at = "01:00:00:00", value = 0.0 },
  { at = "01:00:08:00", value = 1.0, curve = "smoothstep" },
  { at = "01:00:16:00", value = 0.6 },
  { at = "01:00:39:12", value = 0.6, curve = "in_quad" },
  { at = "01:00:40:00", value = 1.0 },
  { at = "01:01:12:00", value = 1.0, curve = "linear" },
  { at = "01:01:20:00", value = 0.0 },
]
