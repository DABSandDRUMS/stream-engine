# The nightly song (PLAN §7): cues fire from the YouTube player's position.
#
# The timeline is active only while this video is the one playing (`song.media`), follows
# `song.position` (smoothed and interpolated; a seek is a jump: the tracked state at the new
# position is applied instead of firing every skipped cue), and holds while the player pauses.
#
# Replace VIDEO_ID with the song's YouTube video id (the `v=` part of its URL).
media = "yt:VIDEO_ID"

# Times are the song's own time: "m:ss.mmm". Each cue's `do` is any command list (like rules).
cues = [
  { at = "1:12.400", do = ["preset.fire chorus_blast"], label = "chorus" },
  { at = "1:43.000", do = ["lights.cue blackout"], label = "drop" },
]

# The whole chorus gets the chase look; it ends with the chorus (and is re-applied when
# someone seeks into the middle of it).
[[track]]
name = "looks"
regions = [
  { start = "1:12.400", end = "1:43.000", cuelist = "chase_fast", label = "chorus chase" },
]

# Grade intensity rides the song: calm verse, full chorus, back down after the drop.
[[track]]
name = "grade"
type = "automation"
address = "fx.grade.amount"
keys = [
  { at = "0:00.000", value = 0.2 },
  { at = "1:10.000", value = 0.2, curve = "smoothstep" },
  { at = "1:12.400", value = 0.8 },
  { at = "1:43.000", value = 0.8, curve = "out_quad" },
  { at = "1:50.000", value = 0.2 },
]
