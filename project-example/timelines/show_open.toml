# Show opener on the internal show clock: `timeline.play show_open` from a deck key, a rule
# (e.g. on `mode.enter.live`), or the Timeline view; `timeline.stop show_open` releases it.
#
# It also generates timecode so external gear can follow our clock: MTC on the Studio 24c's
# MIDI out and LTC on the `timecode.ltc` audio output (route it to a hardware channel in
# project.toml [audio.direct."timecode.ltc"]).
label = "Show opener"
source = "internal"
fps = "30"
length = "0:45.000"

[timecode_out]
mtc = "studio24c"
ltc = true

cues = [
  { at = "0:00.000", do = ["scene.cut wide"], label = "open wide" },
  { at = "0:20.000", do = ["scene.cut duo morph"], label = "duo" },
  { at = "0:44.000", do = ["timeline.stop show_open"], label = "done" },
]

[[track]]
name = "looks"
regions = [
  { start = "0:00.000", end = "0:20.000", preset = "chill", label = "calm open" },
  { start = "0:20.000", end = "0:24.000", fx = "rgb_split", label = "hit" },
]

[[track]]
name = "vignette"
type = "automation"
address = "fx.vignette.amount"
keys = [
  { at = "0:00.000", value = 1.0 },
  { at = "0:10.000", value = 0.3, curve = "out_cubic" },
]
