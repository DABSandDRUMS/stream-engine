# Music ducks under the mic (mic.talking — from the 16R vocal meter via se-mixer, or the
# vocal stem) and under TTS. Manual/preset ducking: audio.duck.active (presets/duck.toml)
# or the `audio.duck` action.
[duck]
targets = ["music"]
depth = -12.0          # dB
attack = "40ms"
release = "400ms"
hold = "250ms"
signals = ["mic.talking"]
keys = ["tts"]
threshold = -45.0      # dBFS on the key bus
