# Audio graph (docs/audio.md). Every audio/*.toml file is merged into project.toml's [audio]
# table in file-name order, so settings can live in either place.

# PipeWire quantum (frames per cycle) requested by the engine node: 256 @ 48 kHz = 5.3 ms.
# Use 64 for the low-latency drum monitor path (M12); needs realtime scheduling.
quantum = 256

# No hardware capture is configured by the starter. Add the actual device and channels
# in Sound → Mix → Add input; device discovery alone does not enable capture.

# hub.audio slots → buses (defaults: youtube, web.* → music; tts → tts; sfx.* → sfx;
# game* → game; patch.* → sfx). Per-slot A/V delay:
[slots]
"youtube" = { bus = "music", delay = "0ms" }

# Optional software-audio playback to the configured external mixer.
# Keep any capture feed returning from that mixer out of this output to avoid feedback.
# If the cable uses the front-panel jack, select "Motherboard Audio Front Headphones".
[playback]
target = "Motherboard Audio Speakers"
channels = [1, 2]
buses = ["music", "sfx", "tts", "game"]

# Analysis of app playback; select other analysis buses explicitly when needed.
[analysis]
buses = ["music"]
beat_source = "auto"
min_bpm = 70
max_bpm = 180
