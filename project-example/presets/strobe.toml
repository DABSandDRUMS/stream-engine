# Strobe look. Needs confirmation and never runs from chat (photosensitivity).
label = "STROBE"
color = "#dcd7ba"
hold = "3s"
confirm = true
lights = { cue = "strobe" }
# Flash rate of the lights' strobe effect while it runs. The output limiter caps flashes at
# 3 a second whatever this says, so the knob stops there.
set = { "lights.effect.strobe.rate" = 2.5 }

[[knob]]
label = "Strobe speed"
target = "lights.effect.strobe.rate"
min = 0.5
max = 3.0
step = 0.25
unit = "flashes a second"
default = 2.5
