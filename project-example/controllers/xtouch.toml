# Behringer X-TOUCH MINI in MC (Mackie Control) mode. The engine switches the unit into MC
# mode on connect (`mode_select = false` to leave it alone).
#
# Controls of the `xtouch_mini_mc` profile (signals `midi.xtouch.<control>`, button events
# `midi.xtouch.<control>` / `.up`):
#   enc.1–enc.8     endless encoders (relative) with LED rings
#   push.1–push.8   encoder pushes
#   btn.1–btn.8     top row buttons (LEDs)      btn.9–btn.16   bottom row buttons (LEDs)
#   layer.a, layer.b                            fader          60 mm fader (not motorized)
#
# Two identical units: add `usb = "usb-0000:0a:00.0-2.2"` (see `streamctl query controllers.midi.ports`).
kind = "midi"
match = "X-TOUCH MINI*"
profile = "xtouch_mini_mc"

# Controls are unassigned. Map them explicitly in the Controllers view.
