# Behringer X-TOUCH MINI in MC (Mackie Control) mode. The engine switches the unit into MC
# mode on connect (`mode_select = false` to leave it alone).
#
# Controls of the `xtouch_mini_mc` profile (signals `midi.xtouch.<control>`, button events
# `midi.xtouch.<control>` / `.up`):
#   enc.1–enc.8     endless encoders (relative) with LED rings
#   push.1–push.8   encoder pushes
#   btn.1–btn.8     top row buttons (LEDs)      btn.9–btn.16   bottom row buttons (LEDs)
#   layer.a, layer.b                            fader          60 mm fader (not motorized)
#
# Two identical units: add `usb = "usb-0000:0a:00.0-2.2"` (see `stream query controllers.midi.ports`).
kind = "midi"
match = "X-TOUCH MINI*"
profile = "xtouch_mini_mc"

# Encoders adjust parameters at manual priority; their LED rings follow the value however it
# changed (UI, CLI, presets, other controllers). Pushing an encoder releases the override.
[[map]]
control = "enc.1"
target = "fx.rgb_split.amount"
[[map]]
control = "enc.2"
target = "fx.vhs.amount"
[[map]]
control = "enc.3"
target = "fx.grade.warmth"
ring = "boost"
[[map]]
control = "enc.4"
target = "audio.bus.music.gain"
[[map]]
control = "enc.5"
target = "audio.bus.sfx.gain"
[[map]]
control = "enc.6"
target = "lights.master"
[[map]]
control = "enc.7"
target = "clips.hype.threshold"
[[map]]
control = "enc.8"
inc = ["scene.next"]
dec = ["scene.prev"]

[[map]]
control = "push.1"
do = ["release fx.rgb_split.amount"]
[[map]]
control = "push.2"
do = ["release fx.vhs.amount"]
[[map]]
control = "push.3"
do = ["release fx.grade.warmth"]
[[map]]
control = "push.4"
do = ["release audio.bus.music.gain"]
[[map]]
control = "push.5"
do = ["release audio.bus.sfx.gain"]
[[map]]
control = "push.6"
do = ["release lights.master"]

# Top row: presets (LED lit while active). Bottom row: scenes (lit = program,
# blinking = preview), take, voice, marker, panic.
[[map]]
control = "btn.1"
preset = "hype"
[[map]]
control = "btn.2"
preset = "confetti"
[[map]]
control = "btn.3"
preset = "chill"
[[map]]
control = "btn.4"
preset = "chorus_blast"
[[map]]
control = "btn.5"
preset = "sub_big"
[[map]]
control = "btn.6"
preset = "blackout"
[[map]]
control = "btn.7"
do = ["scene.take"]
[[map]]
control = "btn.8"
do = ["clean"]

[[map]]
control = "btn.9"
scene = "duo"
[[map]]
control = "btn.10"
scene = "wide"
[[map]]
control = "btn.11"
scene = "kit"
[[map]]
control = "btn.12"
scene = "drums"
[[map]]
control = "btn.13"
scene = "room"
[[map]]
control = "btn.14"
ptt = true
[[map]]
control = "btn.15"
do = ["session.marker xtouch"]
[[map]]
control = "btn.16"
do = ["panic"]
hold = "1s"

# Layer buttons page the Stream Deck.
[[map]]
control = "layer.a"
page = "prev"
[[map]]
control = "layer.b"
page = "next"

# The fader is not motorized: pickup = no effect until it passes the current value, so it
# never jumps; raising it from zero also starts the list (fader_start). Release the override with
# `stream release lights.cuelist.main.master`.
[[binding]]
target = "lights.cuelist.main.master"
signal = "midi.xtouch.fader"
takeover = "pickup"
feedback = true
