# Line 6 FBV Express Mk II over USB: hands-free while drumming.
#
# The FBV sends whatever its internal FBV-Control preset says (each control on channel 1 of one
# of its four USB MIDI ports; all four are read). The numbers below follow Line 6's own worked
# example (footswitch A–D → CC 1–4, pedal → CC 7). If your unit was programmed differently:
#   * watch `stream query controllers.midi.monitor '{"device":"fbv"}'` while stomping, then edit `cc`, or
#   * `stream do "midi.learn preset.hype"` and stomp the switch: the switch is declared here and mapped.
# Undeclared messages still arrive as signals `midi.fbv.cc.<n>` / events `midi.fbv.note.<n>`.
kind = "midi"
match = "FBV Express Mk II*"

# Footswitches. `switch = "momentary"` = 127 on press / 0 on release (FBV "Momentary" or "Single"
# mode); use `switch = "trigger"` if the FBV switch is in "Toggle" mode (every stomp is one press).
[control.fs_a]
cc = 1
switch = "momentary"
[control.fs_b]
cc = 2
switch = "momentary"
[control.fs_c]
cc = 3
switch = "momentary"
[control.fs_d]
cc = 4
switch = "momentary"

# Expression pedal: a live signal `midi.fbv.pedal` (0–1), usable in any binding.
[control.pedal]
cc = 7

[[map]]
control = "fs_a"
preset = "hype"
[[map]]
control = "fs_b"
preset = "confetti"
[[map]]
control = "fs_c"
do = ["scene.next", "scene.take"]
[[map]]
control = "fs_d"
ptt = true

# Use the pedal anywhere a signal fits, e.g. ride the front wash during rehearsal:
# [[binding]]
# target = "lights.group.front.intensity"
# signal = "midi.fbv.pedal"
# scope = "mode.rehearsal"
