# Stream Deck Original V2 (15 keys: 5 × 3, key 0 = top left, 5 = middle row, 10 = bottom row).
# Keys render with the Omarchy theme and font and follow engine state: presets light while
# active (with a hold countdown), scene keys show program (red) / preview (yellow), toggles
# show on/off. The UI pad grid mirrors the current page (`controllers.page`).
#
# A key does exactly one of:
#   preset = "name"            fire a preset (toggle presets release on the second press)
#   scene = "name"             scene → preview (`cut = true`: straight to program)
#   toggle = "address"         flip a bool (numbers flip 0 ↔ 1)
#   momentary = "address"      on while held
#   do = ["command", …]        any commands (`release = [...]` runs on key-up; `wait 1s` works)
#   page = "name"              switch page (`next`/`prev` too)
#   ptt = true                 voice push-to-talk (hold and speak)
# Options: label, icon (name or Nerd Font glyph), color ("#rrggbb" or a theme token such as
# "red", "accent"), state (address that lights the key), hold = "1s" (hold to fire),
# confirm = true (press twice), cooldown = "2s".
kind = "deck"
brightness = 70
pages = ["show", "mix", "fx", "songs"]

[page.show]
label = "SHOW"

[page.show.key.0]
scene = "duo"
[page.show.key.1]
scene = "wide"
[page.show.key.2]
scene = "kit"
[page.show.key.3]
scene = "drums"
[page.show.key.4]
scene = "room"

[page.show.key.5]
preset = "hype"
[page.show.key.6]
preset = "confetti"
[page.show.key.7]
preset = "chill"
[page.show.key.8]
preset = "chorus_blast"
[page.show.key.9]
do = ["scene.take"]
color = "accent"

[page.show.key.10]
page = "mix"
[page.show.key.11]
page = "fx"
[page.show.key.12]
ptt = true
[page.show.key.13]
do = ["clean"]
[page.show.key.14]
do = ["panic"]
hold = "1s"

[page.mix]
label = "MIX"

[page.mix.key.0]
toggle = "audio.bus.music.mute"
label = "MUSIC"
icon = "music"
color = "red"
[page.mix.key.1]
toggle = "audio.bus.band.mute"
label = "BAND"
icon = "drum"
color = "red"
[page.mix.key.2]
toggle = "audio.bus.sfx.mute"
label = "SFX"
icon = "bell"
color = "red"
[page.mix.key.3]
toggle = "audio.bus.tts.mute"
label = "TTS"
icon = "chat"
color = "red"
[page.mix.key.4]
# the Main cue list: next cue (starts the list; fades, follows and waits run from the file)
do = ["lights.go main"]
label = "LX GO"
icon = "play"
[page.mix.key.5]
do = ["audio.play airhorn"]
label = "HORN"
[page.mix.key.6]
do = ["lights.cue chase_fast"]
label = "CHASE"
[page.mix.key.7]
do = ["lights.cue warm_duo"]
label = "WARM"
[page.mix.key.8]
do = ["lights.cue safe"]
label = "SAFE LX"
[page.mix.key.10]
page = "show"
[page.mix.key.11]
page = "fx"
[page.mix.key.12]
ptt = true
[page.mix.key.13]
do = ["session.marker deck"]
[page.mix.key.14]
do = ["panic"]
hold = "1s"

[page.fx]
label = "FX"

[page.fx.key.0]
preset = "strobe"
confirm = true
[page.fx.key.1]
preset = "blackout"
[page.fx.key.2]
preset = "sub_big"
[page.fx.key.3]
do = ["trigger patch.confetti"]
label = "CONFETTI"
icon = "star"
cooldown = "2s"
[page.fx.key.4]
do = ["trigger patch.sub_meteors"]
label = "METEORS"
icon = "star"
cooldown = "2s"
[page.fx.key.5]
momentary = "fx.rgb_split.amount"
label = "SPLIT"
color = "magenta"
[page.fx.key.6]
momentary = "fx.vhs.amount"
label = "VHS"
color = "magenta"
[page.fx.key.10]
page = "show"
[page.fx.key.11]
page = "songs"
[page.fx.key.12]
ptt = true
[page.fx.key.14]
do = ["panic"]
hold = "1s"

[page.songs]
label = "SONGS"

[page.songs.key.0]
do = ["queue.skip"]
label = "SKIP"
icon = "next"
[page.songs.key.1]
do = ["queue.pause"]
label = "PAUSE"
icon = "stop"
[page.songs.key.2]
do = ["queue.resume"]
label = "RESUME"
icon = "play"
[page.songs.key.3]
do = ["queue.open"]
label = "OPEN SR"
icon = "queue"
state = "queue.open"
[page.songs.key.4]
do = ["queue.close"]
label = "CLOSE SR"
icon = "cross"
[page.songs.key.10]
page = "show"
[page.songs.key.11]
page = "mix"
[page.songs.key.12]
ptt = true
[page.songs.key.14]
do = ["panic"]
hold = "1s"
