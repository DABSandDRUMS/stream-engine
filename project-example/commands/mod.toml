# Moderator tools. Built-ins can be renamed or re-gated like any command.
# Chat edits (!addcom/!editcom/!delcom) only touch plain reply commands; new ones go to
# commands/custom.toml ([bot] custom_file in project.toml).

[[command]]
name = "!addcom"
role = "mod"
builtin = "addcom"
min_args = 2
usage = "Usage: !addcom !name reply text (placeholders: {user} {args} {count} {random:a|b})"

[[command]]
name = "!editcom"
role = "mod"
builtin = "editcom"
min_args = 2
usage = "Usage: !editcom !name new reply text"

[[command]]
name = "!delcom"
role = "mod"
builtin = "delcom"
min_args = 1
usage = "Usage: !delcom !name"

[[command]]
name = "!commands"
builtin = "commands"
cooldown = { global = "30s" }

# --- quotes and counters (stored in the runtime DB) ------------------------------------

[[command]]
name = "!quote"
builtin = "quote"
cooldown = { global = "10s" }

[[command]]
name = "!addquote"
role = "vip"
builtin = "addquote"
min_args = 1
usage = "Usage: !addquote <the quote>"

[[command]]
name = "!delquote"
role = "mod"
builtin = "delquote"
min_args = 1
usage = "Usage: !delquote <number>"

[[command]]
name = "!setcounter"
role = "mod"
builtin = "setcounter"
min_args = 2
usage = "Usage: !setcounter <name> <value | +n | -n>"

# --- alerts and TTS ---------------------------------------------------------------------

# Kill a queued or on-screen alert by its number (shown in the mod view / UI).
[[command]]
name = "!veto"
role = "mod"
action = "alerts.veto"
args = { id = "{1}" }
min_args = 1
usage = "Usage: !veto <alert number>"

[[command]]
name = "!skipalert"
role = "mod"
action = "alerts.skip"

[[command]]
name = "!skiptts"
role = "mod"
action = "tts.skip"

[[command]]
name = "!cleartts"
role = "mod"
action = "tts.clear"
