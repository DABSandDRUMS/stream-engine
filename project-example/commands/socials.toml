# Chat commands: social links and fun stuff.
# Placeholders: {user} {touser} {args} {1}..{9} {count} {uptime} {song} {random:a|b|c}
# and any state address, e.g. {goals.subs.current} or {stats.latest.follow.user}.
# Roles: everyone < follower < sub < vip < mod < owner. Mods skip cooldowns.
# Edit here, in the UI (Views → Chatbot), or from chat with !addcom / !editcom / !delcom.

[[command]]
name = "!discord"
reply = "Join the Discord: https://discord.gg/xxxx"
cooldown = { global = "30s" }

[[command]]
name = "!socials"
aliases = ["!links"]
reply = "YouTube: https://youtube.com/@yourchannel · Instagram: https://instagram.com/yourchannel · Ko-fi: https://ko-fi.com/yourchannel"
cooldown = { global = "30s" }

[[command]]
name = "!uptime"
reply = "We've been live for {uptime}."
cooldown = { global = "10s" }

[[command]]
name = "!lurk"
reply = "{user} is lurking — enjoy the grooves {random:🥁|🎶|🤘}"
cooldown = { per_user = "10m" }

[[command]]
name = "!so"
role = "mod"
reply = "Go check out {touser} at https://twitch.tv/{touser} — they're awesome!"
min_args = 1
usage = "Usage: !so @user"

[[command]]
name = "!goal"
reply = "Sub goal: {goals.subs.current}/{goals.subs.target} · Bits for a new cymbal: {goals.bits.current}/{goals.bits.target}"
cooldown = { global = "30s" }

# VIPs (and up) can fire the hype preset from chat. Chat effects only run in `live`
# (see [policy] effect_modes) and expire after [safety] chat_ttl.
[[command]]
name = "!hype"
role = "vip"
do = ["preset.fire hype"]
reply = "HYPE unlocked by {user}!"
cooldown = { global = "2m" }
deny_reply = "@{user} !hype is for VIPs — grab a sub to join the hype squad"

[[command]]
name = "!drumstick"
reply = "{user} has thrown {count} drumsticks into the crowd so far."
cooldown = { per_user = "1m" }

[[timer]]
name = "discord"
every = "30m"
min_chat_lines = 15
reply = "Hang out between streams on Discord: https://discord.gg/xxxx"
