# Cheers: bigger cheers get longer, louder alerts and a different TTS voice.
[[alert]]
name = "cheer"
when = "twitch.cheer"
title = "{user} cheered {amount} bits!"
message = "{message}"
sound = "alert_cheer"
duration = "6s"
priority = 40
tts = true
tts_text = "{user} says: {message}"

[[alert.variation]]
name = "huge"
if = "amount >= 10000"
title = "{user} cheered {amount} BITS!!!"
sound = "alert_cheer_big"
duration = "14s"
priority = 95
voice = "am_michael"

[[alert.variation]]
name = "big"
if = "amount >= 1000"
title = "{user} cheered {amount} bits!"
sound = "alert_cheer_big"
duration = "10s"
priority = 75

[[alert.variation]]
name = "small"
if = "amount < 100"
duration = "4s"
priority = 20
tts = false
