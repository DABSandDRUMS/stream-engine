# Raids interrupt anything smaller (priority margin in alerts/queue.toml).
[[alert]]
name = "raid"
when = "twitch.raid"
title = "{user} is raiding with {viewers} viewers!"
message = "Welcome raiders!"
sound = "alert_raid"
duration = "8s"
priority = 85

[[alert.variation]]
name = "small"
if = "amount < 10"
title = "{user} dropped by with {viewers} friends!"
duration = "5s"
priority = 30
