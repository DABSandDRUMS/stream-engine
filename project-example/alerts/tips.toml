# Ko-fi tips (via the relay). Private tips arrive as "Anonymous" with no message.
[[alert]]
name = "tip"
when = "tip"
title = "{user} tipped {money}!"
message = "{message}"
sound = "alert_tip"
duration = "7s"
priority = 50
tts = true
tts_text = "{user} says: {message}"

[[alert.variation]]
name = "big"
if = "amount >= 20"
title = "{user} tipped {money}!!"
duration = "12s"
priority = 80
voice = "bf_emma"
