# Alert queue policy (§14.2). One [queue] table for the whole project.
[queue]
# Gap between two alerts.
min_spacing = "1s"
# No alert stays up longer than this, whatever its duration says.
max_on_screen = "15s"
# Beyond this many waiting alerts, the lowest-priority newest one is dropped.
max_queue = 200
# Big alerts cut small ones short when their priority is at least `interrupt_margin` higher.
interrupt = true
interrupt_margin = 30
# What happens to the interrupted alert: "requeue" (shows again later) or "drop".
on_interrupt = "requeue"
# Hold the queue in these modes and replay afterwards.
pause_modes = ["ad_break", "brb"]
# Alerts carrying viewer text wait this long so a mod can veto them — unless the policy
# layer already held them ([policy] veto thresholds mark those `vetted`).
veto_window = "3s"
# Gifted subs arriving within this window join their gift bomb (one combined alert).
gift_window = "3s"
# Longest viewer message shown on an alert (characters).
max_message = 300
