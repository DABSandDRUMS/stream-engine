# Be right back: background patch + music. Music stays up while this scene is on program:
# no ducking and the music bus at 0 dB (both come back when the scene changes).
key = 6
set = { "audio.duck.depth" = 0.0, "audio.bus.music.gain" = 0.0 }

[canvas.wide]
nodes = [{ src = "patch.aurora", rect = [0.0, 0.0, 1.0, 1.0] }]

[canvas.tall]
nodes = [{ src = "patch.aurora", rect = [0.0, 0.0, 1.0, 1.0] }]

[transitions]
name = "fade"
ms = 1200
