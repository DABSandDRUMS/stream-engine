# Ad break (mode `ad_break`, rules/modes.toml): no cameras, the aurora background, and a
# "back in a moment" card counting down the Twitch ad. Music stays up while this scene is on
# program: no ducking and the music bus at 0 dB (both come back when the scene changes).
label = "Ad break"
key = 7
set = { "audio.duck.depth" = 0.0, "audio.bus.music.gain" = 0.0 }

[canvas.wide]
nodes = [
  { src = "patch.aurora",   rect = [0.0, 0.0, 1.0, 1.0] },
  { src = "patch.ad_break", rect = [0.0, 0.0, 1.0, 1.0] },
]

# The card page is rendered 16:9 (its largest node), so it keeps that shape on the tall canvas.
[canvas.tall]
nodes = [
  { src = "patch.aurora",   rect = [0.0, 0.0, 1.0, 1.0] },
  { src = "patch.ad_break", rect = [0.0, 0.342, 1.0, 0.3164] },
]

[transitions]
name = "fade"
ms = 800
