# The band mix's bass drives the zoom pulse strength. auto_normalize adapts the gain over 8 s,
# so a quiet song and a loud song move it the same amount.
target = "fx.zoom_pulse.amount"
signal = "band.bass"
auto_normalize = "8s"
gate = 0.2
curve = "smoothstep"
range = [0.0, 0.6]
attack = "10ms"
release = "180ms"
mode = "replace"
