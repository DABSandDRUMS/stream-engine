# Lighting infrastructure only: no fixtures, groups, looks, effects or cue lists are installed.
# Add the real fixtures in the Lights view. Profiles in lights/fixtures are a library, not a patch.

[output]
rate_hz = 44.0
rt_priority = 40

# Detected ENTTEC DMX USB PRO. Enable output only after deliberately configuring the fixtures.
[outputs.usb]
kind = "enttec_pro"
enabled = false
port = "auto"
universe = 1
channels = 512
# The widget's own output rate is stored in the widget (it shipped at 40 packets/s); 0 = as fast
# as the universe size allows (~44 Hz for 512 channels), applied once on connect.
widget_rate = 0

# Network outputs for future nodes. Enable when a node is on the network.
[outputs.sacn]
kind = "sacn"
enabled = false
universes = [1]
priority = 100
destination = "multicast"

[outputs.artnet]
kind = "artnet"
enabled = false
destination = "2.255.255.255"
universes = [1]
net = 0
subnet = 0

# Output-stage limiter, applied after all playbacks, effects, programmer and chat.
[safety]
# At most this many flash onsets in any 1 s window, per head and rig-wide (photosensitivity guideline).
max_flash_hz = 3.0
# A flash = luminance rise of at least this much (0..1) from a level below 0.8 of full.
flash_threshold = 0.2
# Brightness cap for every head.
max_intensity = 1.0
# Hardware strobe channels: limit = cap to max_flash_hz via the profile hz mapping; block = force open.
strobe = "limit"
# lights.panic uses blackout until a different safety look is explicitly configured.
safe_look = { intensity = 0.0 }

[rdm]
discover_on_start = false
