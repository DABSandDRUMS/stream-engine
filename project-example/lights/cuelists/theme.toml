# Theme colour: every head takes the stream accent colour (follows the Omarchy/stream palette live).
# Colour only (LTP): combine with any intensity source (another cue, a fader, the programmer).
label = "Theme color"
priority = 150
release = "1s"

[[cue]]
id = "1"
label = "Stream accent"
fade = "1s"

[cue.set]
all = { color = "stream:accent" }
