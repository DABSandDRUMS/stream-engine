# Fast free-running colour chase at full (hype / chorus presets).
label = "Fast chase"
priority = 300
release = "0.5s"

[[cue]]
id = "1"
label = "Chase fast"
fade = "0.2s"
effects = { chase_fast = {} }

[cue.set]
all = { intensity = 1.0 }

# Knobs: what the Lights page lets you adjust (docs/lights.md §2.7).
[[knob]]
label = "Speed"
target = "cue.1.effects.chase_fast.rate"
min = 0.5
max = 6.0
step = 0.25
unit = "rounds a second"
default = 2.0

[[knob]]
label = "Brightness"
target = "cue.1.set.all.intensity"
min = 0.0
max = 1.0
step = 0.05
unit = "%"
default = 1.0
