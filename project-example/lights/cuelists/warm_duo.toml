# Warm front light for the duo scene.
label = "Warm duo"
priority = 200
release = "1.5s"

[[cue]]
id = "1"
label = "Warm front"
fade = "1.5s"

[cue.set]
front = { intensity = 0.85, palette = "warm" }

# Knobs: what the Lights page lets you adjust (docs/lights.md §2.7).
[[knob]]
label = "Brightness"
target = "cue.1.set.front.intensity"
min = 0.0
max = 1.0
step = 0.05
unit = "%"
default = 0.85
