# Strobe look: white at full with the strobe effect.
# The output limiter caps flashes at [safety] max_flash_hz (3/s) regardless of the effect rate,
# per head and rig-wide; hardware strobe channels are capped through the profile hz mapping.
label = "Strobe"
priority = 400
release = "0.3s"

[[cue]]
id = "1"
label = "Strobe white"
fade = "0s"
effects = { strobe = {} }

[cue.set]
all = { intensity = 1.0, color = "palette:white" }
