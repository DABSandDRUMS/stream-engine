# Beat-synced colour chase at full: follows the beat clock (beat.phase / beat.bpm).
label = "Beat chase"
priority = 300
release = "1s"

[[cue]]
id = "1"
label = "Chase on the beat"
fade = "0.5s"
effects = { chase = {} }

[cue.set]
all = { intensity = 1.0 }

# Knobs: what the Lights page lets you adjust (docs/lights.md §2.7).
[[knob]]
label = "Speed"
target = "cue.1.effects.chase.rate"
kind = "choice"
options = [
  { label = "Every beat", value = 1.0 },
  { label = "Every 2 beats", value = 2.0 },
  { label = "Every 4 beats", value = 4.0 },
  { label = "Every 8 beats", value = 8.0 },
]
default = 4.0

[[knob]]
label = "Brightness"
target = "cue.1.set.all.intensity"
min = 0.0
max = 1.0
step = 0.05
unit = "%"
default = 1.0
