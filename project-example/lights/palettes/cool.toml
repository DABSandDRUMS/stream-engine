kind = "any"
label = "Cool"

[set]
all = { color = "#80b0ff", intensity = 0.8 }

# Knobs: what the Lights page lets you adjust (docs/lights.md §2.7).
[[knob]]
label = "Color"
target = "set.all.color"
kind = "color"
default = "#80b0ff"

[[knob]]
label = "Brightness"
target = "set.all.intensity"
min = 0.0
max = 1.0
step = 0.05
unit = "%"
default = 0.8
