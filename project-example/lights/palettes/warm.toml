# Warm wash. Cues reference palettes, so editing this updates every cue that uses it
# (cues that give their own intensity keep it).
kind = "any"
label = "Warm"

[set]
all = { color = "#ffb070", intensity = 0.8 }

# Knobs: what the Lights page lets you adjust (docs/lights.md §2.7).
[[knob]]
label = "Color"
target = "set.all.color"
kind = "color"
default = "#ffb070"

[[knob]]
label = "Brightness"
target = "set.all.intensity"
min = 0.0
max = 1.0
step = 0.05
unit = "%"
default = 0.8
