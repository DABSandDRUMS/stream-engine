# Follows the live stream palette (palette.accent): changes with the Omarchy theme / scene colours.
kind = "any"
label = "Stream accent"

[set]
all = { color = "stream:accent", intensity = 0.8 }

# The colour follows the stream, so only the brightness has a knob.
[[knob]]
label = "Brightness"
target = "set.all.intensity"
min = 0.0
max = 1.0
step = 0.05
unit = "%"
default = 0.8
