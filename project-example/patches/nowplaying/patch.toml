# Now playing: title, requester, and progress of the current song request (`queue.now.*`,
# `queue.position`). A scene source placed BESIDE the YouTube player (scenes/duo.toml), never on
# top of it: YouTube's player terms forbid covering the player.
kind        = "web"
entry       = "index.html"
layer       = "source"
label       = "Now playing"
description = "Song request title, requester, and progress, for beside the player"
fps         = 30
params.label          = { type = "string", default = "Now playing" }
params.show_requester = { type = "bool",   default = true }
params.align          = { type = "enum",   default = "right", options = ["left", "right"], description = "Side the text lines up on (toward the player)" }
params.accent         = { type = "color",  default = "#7aa2f7" }
params.text_color     = { type = "color",  default = "#ffffff" }
params.card_bg        = { type = "color",  default = [0.07, 0.08, 0.12, 0.88] }
params.font           = { type = "string", default = "" }
