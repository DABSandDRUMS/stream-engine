# Chat of the win31 "starting soon" terminal (scenes/starting_soon.toml): every chat message
# typed out as a DOS command (`C:\CHAT\NAME>message`) under a blinking prompt, and alerts as
# `*** NEW SUBSCRIBER: … ***` lines. Uses the engine's filtered chat feed (`chat.message`,
# starts filled from `chat.recent`; `chat.delete` / `chat.purge` / `chat.clear` remove lines)
# and the alert queue (`alert.show`; vetoed or purged alerts disappear). Waits while
# `terminal_boot` plays. Shared look: patches/_lib/win31/. Best 80 columns across the full width.
kind        = "web"
entry       = "index.html"
layer       = "source"
label       = "Terminal chat"
description = "Chat typed out as DOS commands, with alert lines"
fps         = 30
params.prompt      = { type = "string", default = "C:\\CHAT", description = "Prompt" }
params.lines       = { type = "int",    default = 40, range = [5, 200], description = "Chat lines to keep" }
params.show_alerts = { type = "bool",   default = true, description = "Show alerts" }
