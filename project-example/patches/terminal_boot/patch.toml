# Boot sequence of the win31 "starting soon" terminal (scenes/starting_soon.toml): a BIOS
# memory test and MS-DOS start-up typed out when the scene comes on (its `on_enter` fires
# `patch.terminal_boot.trigger`). `patch.terminal_boot.active` is on while it plays: the scene
# shows this piece only while it is on and the title and chat pieces only while it is off, and
# terminal_chat holds new lines until it is done. The page ends the trigger itself 0.7 s after
# the typing (`patch.terminal_boot.trigger hold=0 done=true`, which replaces the running one);
# `hold` is only the safety net if the page never gets that far.
# Shared look: patches/_lib/win31/. Best full screen.
kind        = "web"
entry       = "index.html"
layer       = "source"
label       = "Terminal boot"
description = "BIOS and MS-DOS start-up typed out when the scene starts"
fps         = 30
params.brand = { type = "string", default = "DABS", description = "Name on boot screen" }
trigger = { attack = "0ms", hold = "16s", release = "0ms", retrigger = "replace" }
