# Alert box: animated cards driven by the alert queue (alerts/*.toml). The engine decides
# what shows, when, and for how long (`alert.show` / `alert.update` / `alert.hide`); sounds
# and TTS play in the engine, not in the page. Placement: [overlays.alertbox] in project.toml.
kind        = "web"
entry       = "index.html"
layer       = "overlay"
label       = "Alert box"
description = "Follow/sub/gift/cheer/raid/tip alerts with emotes and gift-bomb recipients"
size        = [960, 480]
fps         = 60
params.accent     = { type = "color",  default = "#7aa2f7", description = "Card accent" }
params.text_color = { type = "color",  default = "#ffffff" }
params.card_bg    = { type = "color",  default = [0.07, 0.08, 0.12, 0.88], description = "Card background" }
params.position   = { type = "enum",   default = "center", options = ["top", "center", "bottom"] }
params.scale      = { type = "float",  default = 1.0, range = [0.5, 2.0] }
params.style      = { type = "enum",   default = "pop", options = ["pop", "slide", "fade"], description = "Entrance animation" }
params.show_icon  = { type = "bool",   default = true }
params.font       = { type = "string", default = "", description = "CSS font-family (empty = Inter/Noto Sans)" }
