<!doctype html>
<!-- Title box of the win31 "starting soon" terminal. Browser test:
     /patches/terminal_title/index.html?token=<token>, then `streamctl do patch.terminal_title.trigger`
     (what the starting_soon scene does when it comes on). -->
<html>
<head>
<meta charset="utf-8">
<title>terminal_title</title>
<link rel="stylesheet" href="/patches/_lib/win31/dos.css">
<style>
  .dos { color: #fff; }
  .row { display: flex; }
  .big { flex: 1; text-align: center; font-size: 48px; line-height: 48px; color: #ffff55; overflow: hidden; }
  .side { width: 12px; }
</style>
</head>
<body>
<div class="dos" id="screen"><div id="top"></div><div class="row"><div class="side">&#9553;<br>&#9553;</div><div class="big" id="big"></div><div class="side">&#9553;<br>&#9553;</div></div><div id="mid"></div><div id="count"></div><div id="bot"></div></div>
<script src="/engine.js"></script>
<script src="/web/overlay.js"></script>
<script src="/patches/_lib/win31/dos.js"></script>
<script>
  "use strict";
  const se = Engine.connect();
  const ID = se.patch ? se.patch.id : "terminal_title";
  const $ = id => document.getElementById(id);
  const P = Overlay.params(se, { title: "THE STREAM IS ABOUT TO START", count_to: "minutes", minutes: 5, clock_time: "20:00" }, tick);
  const BAR = 40;

  Dos.fit($("screen"), 6);
  $("top").textContent = Dos.line("\u2554", "\u2550", "\u2557");
  $("mid").textContent = Dos.line("\u2551", " ", "\u2551");
  $("bot").textContent = Dos.line("\u255a", "\u2550", "\u255d");

  // When the scene came on (unix ms). Kept in `patch.<id>.started` so a reloaded page
  // continues; before the first start the countdown runs from when the page loaded.
  let started = 0;
  const loaded = Date.now();
  const keep = Dos.keeper(se, `patch.${ID}.started`);

  // The end of the countdown for a start at `from`: `minutes` later, or the next `clock_time`
  // (a time up to 6 hours ago counts as passed: "Starting NOW").
  function end(from) {
    const m = P.count_to === "clock_time" && /^\s*(\d{1,2})[:.h](\d{2})\s*$/.exec(String(P.clock_time || ""));
    if (m) {
      const d = new Date(from);
      d.setHours(+m[1], +m[2], 0, 0);
      if (d.getTime() < from - 6 * 3600000) d.setDate(d.getDate() + 1);
      return d.getTime();
    }
    return from + Math.max(0, Number(P.minutes) || 5) * 60000;
  }

  function tick() {
    $("big").textContent = String(P.title || "").slice(0, 38);
    const from = started || loaded, target = end(from), total = Math.max(1000, target - from);
    const left = target - Date.now();
    const p = Math.max(0, Math.min(1, 1 - left / total));
    const filled = Math.round(p * BAR);
    const bar = "\u2588".repeat(filled) + "\u2591".repeat(BAR - filled);
    const label = left > 0 ? `Starting in ${Dos.mmss(left / 1000).padStart(5)}` : "Starting NOW...    ";
    const inner = `  ${label}  ${bar} ${String(Math.round(p * 100)).padStart(3)}%`;
    $("count").textContent = "\u2551" + inner.padEnd(Dos.COLS - 2).slice(0, Dos.COLS - 2) + "\u2551";
    $("big").classList.toggle("blink", left <= 0);
  }
  tick();
  setInterval(tick, 250);

  se.on(`patch.${ID}.trigger`, () => {
    started = Date.now();
    keep(started);
    tick();
  });
  se.state(`patch.${ID}.started`, (_, v) => {
    const n = Number(v) || 0;
    if (n > 0 && n !== started) {
      started = n;
      tick();
    }
  });
</script>
</body>
</html>
