# End-of-stream credits roll: session subs, gifts, cheers, tips, raids, follows, and top
# chatters from the `credits` query. Rolls on `patch.credits.trigger` (e.g. a rule on
# `mode.enter.outro`) and when the page loads in outro.
kind        = "web"
entry       = "index.html"
layer       = "overlay"
label       = "Credits"
description = "End-of-stream credits roll from this session's events"
fps         = 60
params.title      = { type = "string", default = "Thanks for hanging out!" }
params.speed      = { type = "float",  default = 60.0, range = [10.0, 400.0], unit = "px/s", description = "Scroll speed" }
params.chatters   = { type = "int",    default = 15, range = [0, 100], description = "Top chatters to list" }
params.loop       = { type = "bool",   default = false, description = "Start over when finished" }
params.accent     = { type = "color",  default = "#7aa2f7" }
params.text_color = { type = "color",  default = "#ffffff" }
params.backdrop   = { type = "color",  default = [0.02, 0.02, 0.04, 0.55] }
params.font       = { type = "string", default = "" }
trigger = { attack = "0ms", hold = "100ms", release = "0ms", retrigger = "replace" }
