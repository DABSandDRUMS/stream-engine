<!doctype html>
<!-- Countdown. Browser test: /patches/countdown/index.html?token=<token>&minutes=1 -->
<html>
<head>
<meta charset="utf-8">
<title>countdown</title>
<style>
  :root { --accent: #7aa2f7; --fg: #fff; --font: "Inter", "Noto Sans", sans-serif; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; text-shadow: 0 .5vh 2.5vh rgba(0, 0, 0, .6); }
  #title { font-size: 8vh; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  #time { font-size: 24vh; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1; }
  #time.done { font-size: 14vh; animation: pulse 1.2s ease-in-out infinite; }
  #subtitle { font-size: 4vh; opacity: .85; }
  #song { font-size: 3.4vh; opacity: .8; margin-top: 3vh; }
  #song:empty { display: none; }
  #ring { position: absolute; inset: auto 0 0 0; height: 1vh; background: var(--accent); transform-origin: left; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
</style>
</head>
<body>
<div id="title"></div>
<div id="time">--:--</div>
<div id="subtitle"></div>
<div id="song"></div>
<div id="ring"></div>
<script src="/engine.js"></script>
<script src="/web/overlay.js"></script>
<script>
  "use strict";
  const O = Overlay;
  const se = Engine.connect();
  const $ = id => document.getElementById(id);
  const P = O.params(se, {
    minutes: 5, target: "", title: "Starting soon", subtitle: "grab a drink, tune your snare", done_text: "Here we go!",
    show_song: true, deadline: 0, accent: "#7aa2f7", text_color: "#ffffff", font: "",
  }, (_, k) => { apply(); if (k === "target") start({}); });
  let deadline = 0, total = 1, song = "";

  function apply() {
    const r = document.documentElement.style;
    r.setProperty("--accent", O.cssColor(P.accent) || "#7aa2f7");
    r.setProperty("--fg", O.cssColor(P.text_color) || "#fff");
    if (P.font) r.setProperty("--font", P.font);
    $("title").textContent = P.title;
    $("subtitle").textContent = P.subtitle;
    $("song").textContent = P.show_song && song ? `♪ ${song}` : "";
  }
  apply();

  // Next occurrence of local HH:MM.
  function atLocal(hhmm) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || "").trim());
    if (!m) return 0;
    const d = new Date();
    d.setHours(Number(m[1]), Number(m[2]), 0, 0);
    if (d.getTime() < Date.now() - 60000) d.setDate(d.getDate() + 1);
    return d.getTime();
  }

  function start(payload) {
    const p = payload || {};
    const t = atLocal(p.target || P.target);
    const mins = Number(p.minutes) > 0 ? Number(p.minutes) : Number(P.minutes) || 5;
    deadline = t || Date.now() + mins * 60000;
    total = Math.max(1000, deadline - Date.now());
    persist();
  }

  // persist so a reload (or the other canvas's page) continues the same countdown
  let needPersist = false;
  function persist() {
    if (!se.patch || !deadline) return;
    if (!se.connected) {
      needPersist = true;
      return;
    }
    needPersist = false;
    se.set(`patch.${se.patch.id}.deadline`, deadline).catch(() => {});
  }
  se.onconnect = () => { if (needPersist) persist(); };

  function frame() {
    const left = deadline ? Math.max(0, deadline - Date.now()) : 0;
    const el = $("time");
    if (!deadline) {
      el.textContent = "--:--";
    } else if (left <= 0) {
      el.textContent = P.done_text;
      el.classList.add("done");
    } else {
      el.classList.remove("done");
      const s = Math.ceil(left / 1000);
      const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
      el.textContent = (hh ? `${hh}:${String(mm).padStart(2, "0")}` : String(mm).padStart(2, "0")) + `:${String(ss).padStart(2, "0")}`;
    }
    $("ring").style.transform = `scaleX(${deadline ? Math.min(1, left / total) : 0})`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if (se.patch) se.on(`patch.${se.patch.id}.trigger`, e => start(e.payload));
  se.on("mode.enter.preshow", () => start({}));
  se.state("queue.now.title", (_, v) => { song = v || ""; apply(); });
  // resume a running countdown after a reload, else start one if we're already in preshow
  let resumed = false;
  se.state(`patch.${se.patch ? se.patch.id : "countdown"}.deadline`, (_, v) => {
    if (Number(v) > Date.now() && Number(v) !== deadline) {
      deadline = Number(v);
      total = Math.max(total, deadline - Date.now());
      resumed = true;
    }
  });
  se.state("show.mode", (_, m) => {
    setTimeout(() => {
      if (m === "preshow" && !resumed && !deadline) start({});
    }, 300);
  });
  if (new URLSearchParams(location.search).has("minutes") || P.target) start({});
</script>
</body>
</html>
