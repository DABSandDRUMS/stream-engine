# Show layout for two displays (PLAN §15.3), used automatically by show-3disp while the TV is
# off or unplugged:
#   DP-1  main window (Live page)
#   DP-2  multiview and a windowed confidence (program) monitor, side by side
#
# Monitor matches: a connector name ("DP-1"), or "desc:<text>" / "make:<text>" / "model:<text>":
# case-insensitive substrings of what `hyprctl monitors all` reports.

name = "show-2disp"
page = "live"   # page to open on: live | scenes | lights | sound | automation | community | recordings | settings
zoom = 1.0      # in-app zoom on top of the Hyprland monitor scale

[main]
monitor = "DP-1"

# Half of DP-2 (2752×1152 logical at scale 1.25); Hyprland tiles the two windows side by side.
[[windows]]
panel = "multiview"
monitor = "DP-2"
fullscreen = false
size = [1360.0, 1080.0]

[confidence]
enabled = true
monitors = ["DP-2"]
fallback = []
canvases = "both"   # wide | tall | both (side by side)
fullscreen = false  # shares DP-2 with multiview
size = [1360.0, 1080.0]


[show]
# Live page
rail_tab = "chat"     # chat | events | queue | mod
rail_width = 380.0
multiview = false
