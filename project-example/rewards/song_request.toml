# Channel-point song request (§13, §11). Created and owned on Twitch by our app.
# The song queue fulfills the redemption when the song actually starts playing and refunds it
# when the request is rejected (lookup, policy, mod), removed, or can't be played.
title = "Song request"
cost = 500
prompt = "YouTube link or song name"
input_required = true
fulfill = "manual"
on_reject = "refund"
user_cooldown = "2m"
fires = "queue.request {input} redemption_id={redemption_id} reward_id={reward_id}"
