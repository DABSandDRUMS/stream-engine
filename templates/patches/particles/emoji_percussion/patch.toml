# Emoji percussion: drum hits pop pixel-art emoji from fixed spots on the kit. Kick onsets slam a
# burst sprite near the bass drum, snare onsets fling stars, hats twinkle the odd sparkle, and a
# crash (hat onset while the highs are loud) sprays a fan of sparkles. Onsets come from rising edges
# of the band envelopes, so it is always running (no manifest trigger); ring buffers cap the sprite
# count. A patch trigger (counted via se.trigger_count) fires a fanfare from every emitter.
kind        = "particles"
layer       = "overlay"
label       = "Emoji percussion"
description = "Kick, snare, hat and crash hits pop chunky pixel emoji (bursts, stars, sparkles) from spots around the kit"
particles   = { count = 128, sim = "sim.wgsl", draw = "draw.wgsl" }
params.kick_pos    = { type = "vec2",  default = [0.5, 0.84], range = [0.0, 1.0], description = "Kick emitter (0-1 of the layer, y down)" }
params.snare_pos   = { type = "vec2",  default = [0.32, 0.66], range = [0.0, 1.0], description = "Snare emitter" }
params.hat_pos     = { type = "vec2",  default = [0.12, 0.42], range = [0.0, 1.0], description = "Hi-hat emitter (upper left)" }
params.crash_pos   = { type = "vec2",  default = [0.88, 0.4], range = [0.0, 1.0], description = "Crash emitter (upper right)" }
params.sensitivity = { type = "float", default = 0.55, range = [0.1, 0.95], description = "Envelope level that counts as a hit (re-arms below half of it)" }
params.crash_level = { type = "float", default = 0.85, range = [0.3, 1.0], description = "band.high level that turns a hat hit into a crash" }
params.density     = { type = "float", default = 0.7, range = [0.0, 1.0], description = "How many stars and sparkles each hit spawns (rings cap the total)" }
params.pixel       = { type = "float", default = 0.0055, range = [0.002, 0.015], description = "Size of one sprite pixel (fraction of layer height)" }
budget  = { gpu_ms = 0.2 }
