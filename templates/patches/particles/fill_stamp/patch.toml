# Fill stamp: when the drummer plays a fill, a red "FILL!" rubber stamp slams onto the frame with
# a comic burst behind it, slightly rotated, with a worn ink texture, and wears off after a
# moment. Always running (no manifest trigger): fills are detected in the particle sim from the
# snare envelope (onset times in a shift register: `hits` snare onsets within `window` beats),
# with a cooldown between fill stamps. A patch trigger also stamps (in the viewer's colour, at most
# one every 1.2 s).
# A shader can't remember past hits, which is why this is a particles patch: its storage buffer
# keeps the detector state between frames.
kind        = "particles"
layer       = "overlay"
label       = "Fill stamp"
description = "A FILL! rubber stamp with a comic burst slams onto the frame whenever the snare plays a fill"
particles   = { count = 8, sim = "sim.wgsl", draw = "draw.wgsl" }
params.position    = { type = "vec2", default = [0.5, 0.24], range = [0.0, 1.0], description = "Where stamps land (0-1 of the layer, y down); default sits above a face or kit" }
params.scatter     = { type = "float", default = 1.0, range = [0.0, 2.0], description = "Random offset of each stamp around the position" }
params.size        = { type = "float", default = 0.13, range = [0.06, 0.35], description = "Stamp height (fraction of the layer height)" }
params.ink         = { type = "color", default = "#d81e2c", description = "Ink colour of fill stamps (trigger stamps use the viewer's colour)" }
params.hold        = { type = "float", default = 1.3, range = [0.3, 4.0], unit = "s", description = "How long a stamp stays before its ink wears off" }
params.hits        = { type = "int", default = 4, range = [2, 6], description = "Snare hits that count as a fill" }
params.window      = { type = "float", default = 2.0, range = [0.5, 4.0], description = "...within this many beats" }
params.sensitivity = { type = "float", default = 0.5, range = [0.1, 0.95], description = "Snare envelope level that counts as a hit (re-arms below half of it)" }
params.cooldown    = { type = "float", default = 4.0, range = [0.5, 30.0], unit = "s", description = "Minimum time between fill stamps" }
budget = { gpu_ms = 0.1 }
