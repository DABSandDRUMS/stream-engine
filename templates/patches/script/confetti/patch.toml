# Confetti burst (trigger-driven). Presets fire it with `fx = [{ name = "patch.confetti" }]`;
# the trigger payload may carry `count` (pieces) or `amount`/`bits` (scales the burst).
kind        = "script"
entry       = "main.lua"
layer       = "overlay"
label       = "Confetti"
description = "Palette-colored confetti burst from the top and both lower corners"
params.count   = { type = "int",   default = 160, range = [10, 1500], description = "Pieces per burst" }
params.gravity = { type = "float", default = 0.9, range = [0.1, 3.0],  description = "Fall acceleration (layer heights/s²)" }
params.size    = { type = "float", default = 0.012, range = [0.004, 0.04], description = "Piece size (fraction of layer height)" }
params.cannons = { type = "bool",  default = true, description = "Also fire from the lower corners" }
trigger = { attack = "50ms", hold = "5s", release = "1s", retrigger = "stack" }
budget  = { cpu_ms = 2.0 }
