# Polyrhythm dots: A against B pulsing dots locked to the bar, joined where the two rhythms meet.
kind        = "shader"
entry       = "main.wgsl"
layer       = "overlay"
label       = "Polyrhythm Dots"
description = "Two rows (or rings) of dots pulsing A against B over each bar, with the shared downbeat lighting both"
params.ratio_a       = { type = "int", default = 3, range = [1, 12], description = "Dots per bar on the first row / outer ring" }
params.ratio_b       = { type = "int", default = 2, range = [1, 12], description = "Dots per bar on the second row / inner ring" }
params.layout        = { type = "enum", options = ["rows", "rings"], default = "rows", description = "Two rows with a 16th ruler and playhead, or two concentric rings with a clock hand" }
params.style         = { type = "enum", options = ["win31", "neon"], default = "win31", description = "Win 3.1 window with radio-button dots, or a dark neon panel with glowing dots" }
params.position      = { type = "vec2", default = [0.5, 0.5], range = [0.0, 1.0], description = "Window center (0-1 of the frame), kept on screen" }
params.scale         = { type = "float", default = 1.0, range = [0.5, 3.0], description = "Size; pixels snap to whole multiples" }
params.caption_color = { type = "color", default = "#98dbc5", description = "Title bar colour (Win 3.1 style; default matches the stream's window captions)" }
budget = { gpu_ms = 0.1 }
