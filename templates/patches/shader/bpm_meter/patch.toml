# BPM meter: a Win 3.1 window with a chunky dot-matrix BPM readout and a deviation needle gauge.
# Steady (within tolerance of target_bpm) = gold glow; off target = the window flinches red.
# Real drift needs the analysed tempo (beat.bpm) to vary; target_bpm = 0 always reads steady.
kind        = "shader"
entry       = "main.wgsl"
layer       = "overlay"
label       = "BPM Meter"
description = "Big pixel BPM readout with a needle gauge that glows gold on target and flinches red when the tempo drifts"
params.target_bpm    = { type = "float", default = 0.0, range = [0.0, 300.0], unit = "BPM", description = "Tempo to hold; 0 = follow the rounded current tempo (always steady)" }
params.tolerance     = { type = "float", default = 2.0, range = [0.5, 20.0], unit = "BPM", description = "Allowed deviation before it flinches; the gauge spans 3x this either side" }
params.position      = { type = "vec2", default = [0.5, 0.3], range = [0.0, 1.0], description = "Window center (0-1 of the frame), kept on screen" }
params.scale         = { type = "float", default = 1.0, range = [0.5, 3.0], description = "Window size; pixels snap to whole multiples" }
params.caption_color = { type = "color", default = "#98dbc5", description = "Title bar colour (default matches the stream's window captions)" }
budget = { gpu_ms = 0.1 }
