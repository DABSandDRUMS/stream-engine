# Talk mode: when the band is quiet and the mic is up, the picture calms down for chatting.
kind        = "shader"
entry       = "main.wgsl"
layer       = "effect"
label       = "Talk Mode"
description = "While talking between songs (mic up, band quiet) the edges go soft, the grade warms, and a small Windows 3.1 Chat badge with a blinking talk light appears; it all fades back when the music returns"
params.amount   = { type = "float", default = 1.0, range = [0.0, 1.0], description = "Overall strength of the talk look" }
params.blur     = { type = "float", default = 1.0, range = [0.0, 3.0], description = "Soft-focus amount on the edges (1 = about 9 px at 720p)" }
params.warmth   = { type = "float", default = 1.0, range = [0.0, 2.0], description = "Warm grade strength" }
params.badge    = { type = "bool", default = true, description = "Show the Chat badge" }
params.position = { type = "vec2", default = [0.025, 0.86], range = [0.0, 1.0], description = "Badge top-left corner (0-1 of the frame, kept on screen)" }
params.scale    = { type = "float", default = 1.0, range = [0.5, 3.0], description = "Badge size; pixels snap to whole multiples" }
params.mic_gate = { type = "float", default = 0.08, range = [0.01, 0.5], description = "mic.level at which talking counts as on" }
params.band_gate = { type = "float", default = 0.2, range = [0.02, 0.8], description = "band.level below which the band counts as quiet" }
budget = { gpu_ms = 0.3 }
