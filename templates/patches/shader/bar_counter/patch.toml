# Bar counter: a compact Win 3.1 window with a red LED bar number, four beat lamps and a bar progress bar.
kind        = "shader"
entry       = "main.wgsl"
layer       = "overlay"
label       = "Bar Counter"
description = "Win 3.1 bar counter: red LED bar number, 1-2-3-4 beat lamps that flash on the downbeat and turn magenta in fills"
params.position      = { type = "vec2", default = [0.5, 0.1], range = [0.0, 1.0], description = "Window center (0-1 of the frame), kept on screen" }
params.scale         = { type = "float", default = 1.0, range = [0.5, 3.0], description = "Window size; pixels snap to whole multiples" }
params.caption_color = { type = "color", default = "#98dbc5", description = "Title bar colour (default matches the stream's window captions)" }
budget = { gpu_ms = 0.1 }
