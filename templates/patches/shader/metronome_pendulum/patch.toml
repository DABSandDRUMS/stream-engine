# Metronome pendulum: a pyramid metronome whose pendulum swings exactly to the beat.
kind        = "shader"
entry       = "main.wgsl"
layer       = "overlay"
label       = "Metronome Pendulum"
description = "Classic pyramid metronome (wood or Win 3.1 gray) swinging one side per beat with a tick spark and the BPM on its plate"
params.style    = { type = "enum", options = ["wood", "win31"], default = "wood", description = "Mahogany case with brass weight, or Win 3.1 gray with a green readout" }
params.position = { type = "vec2", default = [0.86, 0.53], range = [0.0, 1.0], description = "Metronome center (0-1 of the frame), kept on screen" }
params.scale    = { type = "float", default = 1.0, range = [0.5, 3.0], description = "Size; pixels snap to whole multiples" }
budget = { gpu_ms = 0.1 }
