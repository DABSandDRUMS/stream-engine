# Recent events (follows, subs, gift bombs, cheers, raids, tips) as a list. Gifted subs are
# folded into their gift bomb; banned users disappear (`chat.purge`).
kind        = "web"
entry       = "index.html"
layer       = "overlay"
label       = "{{label}}"
description = "Recent follows, subs, gifts, cheers, raids, and tips"
size        = [420, 560]
fps         = 30
params.max_items  = { type = "int",    default = 8, range = [1, 30] }
params.kinds      = { type = "string", default = "follow,sub,gift,cheer,raid,tip", description = "Comma-separated kinds to list" }
params.accent     = { type = "color",  default = "#bb9af7" }
params.bg         = { type = "color",  default = [0.05, 0.06, 0.1, 0.7] }
params.text_color = { type = "color",  default = "#ffffff" }
params.font       = { type = "string", default = "" }
