# Prediction: the running Twitch prediction (state `twitch.prediction`) with the channel points on
# each outcome, the betting clock, and the result (winner, or canceled and refunded), which stays
# up for `result_seconds`. Placement: [overlays.{{id}}] in project.toml, shown while
# `twitch.prediction.active` or `patch.{{id}}.showing` (the page keeps that on for the result).
# Run predictions from Community → Twitch → Polls & predictions, or `twitch.prediction.*`.
kind        = "web"
entry       = "index.html"
layer       = "overlay"
label       = "{{label}}"
description = "Twitch prediction with points per outcome and the result"
size        = [576, 368]
fps         = 30
params.result_seconds = { type = "float", default = 12.0, range = [0.0, 120.0], unit = "s", description = "How long the result stays up after the prediction ends" }
params.showing        = { type = "bool",   default = false, description = "The card is on screen (set by the page)" }
params.blue           = { type = "color",  default = "#7aa2f7", description = "Outcome color Twitch calls blue" }
params.pink           = { type = "color",  default = "#f7768e", description = "Outcome color Twitch calls pink" }
params.text_color     = { type = "color",  default = "#ffffff" }
params.card_bg        = { type = "color",  default = [0.07, 0.08, 0.12, 0.88] }
params.font           = { type = "string", default = "" }
