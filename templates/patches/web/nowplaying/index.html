<!doctype html>
<!-- Now playing card. Browser test: /patches/nowplaying/index.html?token=<token> while a song
     request plays (`streamctl do "queue.add url=<YouTube link>"`). -->
<html>
<head>
<meta charset="utf-8">
<title>nowplaying</title>
<style>
  :root { --accent: #7aa2f7; --fg: #fff; --bg: rgba(18, 20, 31, .88); --font: "Inter", "Noto Sans", sans-serif; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: var(--fg); display: flex; align-items: flex-end; justify-content: flex-end; }
  body.left { justify-content: flex-start; }
  #card {
    position: relative; display: flex; flex-direction: column; gap: 4vh; max-width: 100%; box-sizing: border-box;
    padding: 9vh 11vh 13vh; border-radius: 14vh; background: var(--bg); overflow: hidden; text-align: right;
    box-shadow: 0 5vh 14vh rgba(0, 0, 0, .4), inset 0 0 0 2vh color-mix(in srgb, var(--accent) 55%, transparent);
    text-shadow: 0 1vh 4vh rgba(0, 0, 0, .5); transition: opacity .4s ease;
  }
  body.left #card { text-align: left; }
  #card.hidden { opacity: 0; }
  #label { font-size: 14vh; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  #title { font-size: 21vh; font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #by { font-size: 15vh; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #by:empty { display: none; }
  #bar { position: absolute; left: 0; bottom: 0; height: 4vh; width: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }
</style>
</head>
<body>
<div id="card" class="hidden">
  <div id="label"></div>
  <div id="title"></div>
  <div id="by"></div>
  <div id="bar"></div>
</div>
<script src="/engine.js"></script>
<script src="/web/overlay.js"></script>
<script>
  "use strict";
  const O = Overlay;
  const se = Engine.connect();
  const $ = id => document.getElementById(id);
  const P = O.params(se, {
    label: "Now playing", show_requester: true, align: "right", accent: "#7aa2f7", text_color: "#ffffff", card_bg: [0.07, 0.08, 0.12, 0.88], font: "",
  }, apply);
  let title = "", user = "";

  function apply() {
    const r = document.documentElement.style;
    r.setProperty("--accent", O.cssColor(P.accent) || "#7aa2f7");
    r.setProperty("--fg", O.cssColor(P.text_color) || "#fff");
    r.setProperty("--bg", O.cssColor(P.card_bg) || "rgba(18,20,31,.88)");
    if (P.font) r.setProperty("--font", P.font);
    document.body.classList.toggle("left", P.align === "left");
    $("label").textContent = `♪ ${P.label}`;
    $("title").textContent = title;
    $("by").textContent = P.show_requester && user ? `requested by ${user}` : "";
    $("card").classList.toggle("hidden", !title);
  }
  apply();

  se.state("queue.now.title", (_, v) => { title = v || ""; apply(); });
  se.state("queue.now.user", (_, v) => { user = v || ""; apply(); });
  // song progress 0–1
  se.signals("queue.position", v => {
    const x = Number(v["queue.position"]);
    if (Number.isFinite(x)) $("bar").style.transform = `scaleX(${Math.max(0, Math.min(1, x))})`;
  }, 4);
</script>
</body>
</html>
