[package]
name = "se-songs"
description = "Song requests: YouTube lookup, cache/library, quota ledger, queue + policy, player control, Cloudflare relay link, Ko-fi tips"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
se-proto.workspace = true
se-hub.workspace = true
se-store.workspace = true
se-clock.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
futures-util.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
rustls = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "gzip", "http2", "charset"] }
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }

[dev-dependencies]
se-core.workspace = true
axum = { version = "0.8", features = ["ws"] }
tempfile.workspace = true
