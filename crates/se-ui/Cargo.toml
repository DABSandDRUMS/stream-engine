[package]
name = "se-ui"
description = "The stream-engine UI: Show/Build modes, panels, layouts (egui on wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
se-proto.workspace = true
se-client.workspace = true
se-ui-kit.workspace = true
eframe.workspace = true
egui.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
se-core.workspace = true
se-clock.workspace = true
se-expr.workspace = true
toml_edit.workspace = true
libc.workspace = true
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan"] }
ash = "0.38"
# clip thumbnails in session review
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# deck key previews (Controllers view)
base64 = "0.23"

[dev-dependencies]
tempfile.workspace = true
# `examples/screens.rs`: headless screenshots of every page against a running engine
egui_kittest = { version = "0.36", features = ["wgpu", "eframe", "snapshot"] }
