[package]
name = "se-web"
description = "Web sources: supervised out-of-process CEF host (web patches, YouTube player) → video/audio slots"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["engine"]
# The engine side (supervisor, IPC reader, hub integration). The CEF host binary depends on this
# crate with `default-features = false` and only uses the `protocol` module.
engine = [
    "dep:se-proto",
    "dep:se-clock",
    "dep:se-core",
    "dep:se-hub",
    "dep:se-api",
    "dep:se-patch",
    "dep:anyhow",
    "dep:tokio",
    "dep:tracing",
    "dep:parking_lot",
    "dep:rtrb",
    "dep:toml",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
se-proto = { workspace = true, optional = true }
se-clock = { workspace = true, optional = true }
se-core = { workspace = true, optional = true }
se-hub = { workspace = true, optional = true }
se-api = { workspace = true, optional = true }
se-patch = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
rtrb = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
se-store.workspace = true
tempfile.workspace = true
tokio.workspace = true
