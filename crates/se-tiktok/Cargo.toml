[package]
name = "se-tiktok"
description = "Best-effort TikTok LIVE events client (unofficial, reverse-engineered, isolated; disabled by default)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["client"]
# The network client (room lookup over HTTPS, sign-provider request, webcast WebSocket).
# Without it the crate still decodes/normalizes frames and serves its config, state and
# actions, but reports `health.tiktok = fail` when enabled.
client = ["dep:reqwest", "dep:tokio-tungstenite", "dep:rustls", "dep:webpki-roots", "dep:futures-util", "dep:serde_json", "dep:url"]

[dependencies]
se-proto.workspace = true
se-hub.workspace = true
se-store.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
toml.workspace = true
prost = "0.14"
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip"], optional = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
webpki-roots = { version = "1", optional = true }
futures-util = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
se-core.workspace = true
se-clock.workspace = true
tokio = { workspace = true, features = ["test-util"] }
axum = { version = "0.8", features = ["ws"] }

[[example]]
name = "probe"
required-features = ["client"]
