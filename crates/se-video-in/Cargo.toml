[package]
name = "se-video-in"
description = "Video sources: V4L2 camera capture (YUYV passthrough, MJPEG via turbojpeg), camera controls, signal detection, FFmpeg media files"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
se-proto.workspace = true
se-core.workspace = true
se-hub.workspace = true
se-clock.workspace = true
se-store.workspace = true
se-devices.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
toml.workspace = true
toml_edit.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
libc.workspace = true
turbojpeg = { version = "1.5", default-features = false, features = ["pkg-config"] }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }

[dev-dependencies]
se-alloc.workspace = true
tempfile.workspace = true
