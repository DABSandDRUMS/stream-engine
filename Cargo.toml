[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DABSandDRUMS/stream-engine"
rust-version = "1.90"

[workspace.dependencies]
se-proto = { path = "crates/se-proto" }
se-clock = { path = "crates/se-clock" }
se-expr = { path = "crates/se-expr" }
se-core = { path = "crates/se-core" }
se-store = { path = "crates/se-store" }
se-api = { path = "crates/se-api" }
se-hub = { path = "crates/se-hub" }
se-client = { path = "crates/se-client" }
se-patch = { path = "crates/se-patch" }
se-app = { path = "crates/se-app" }
se-ui-kit = { path = "crates/se-ui-kit" }
se-ui = { path = "crates/se-ui" }
se-alloc = { path = "crates/se-alloc" }
se-dsp = { path = "crates/se-dsp" }
se-analysis = { path = "crates/se-analysis" }
se-audio = { path = "crates/se-audio" }
se-audio-taps = { path = "crates/se-audio-taps" }
se-input = { path = "crates/se-input" }
se-timeline = { path = "crates/se-timeline" }
se-bot = { path = "crates/se-bot" }
se-alerts = { path = "crates/se-alerts" }
se-dmx = { path = "crates/se-dmx" }
se-devices = { path = "crates/se-devices" }
se-video-in = { path = "crates/se-video-in" }
se-render = { path = "crates/se-render" }
se-web = { path = "crates/se-web" }
se-vector = { path = "crates/se-vector" }
se-frames = { path = "crates/se-frames" }
se-extras = { path = "crates/se-extras" }
se-tts = { path = "crates/se-tts" }
se-tiktok = { path = "crates/se-tiktok" }
se-clips = { path = "crates/se-clips" }
se-obs = { path = "crates/se-obs" }
se-mixer = { path = "crates/se-mixer" }
se-songs = { path = "crates/se-songs" }
se-twitch = { path = "crates/se-twitch" }
cef = { version = "=154.0.0", default-features = false } # CEF 154.0.23 (cef-rs 154.0.0+154.0.23)

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
toml = "1.1"
toml_edit = "0.25"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
crossbeam-channel = "0.5"
arc-swap = "1.9"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
zstd = "0.14"
sd-notify = "0.5"
clap = { version = "4.6", features = ["derive"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
rosc = "0.11"
parking_lot = "0.12"
libc = "0.2"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "default_fonts"] }
egui = "0.36"
tempfile = "3"
triple_buffer = "9"
rtrb = "0.4"
mlua = { version = "0.12", features = ["luajit"] }

[profile.release]
debug = 1
lto = "thin"

# Debug builds: line numbers for our code (backtraces), no debug info for dependencies.
# Full debug info made target/debug grow past 100 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
